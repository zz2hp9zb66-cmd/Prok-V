[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prokv"
version = "0.1.0"
description = "Generate vertical 9:16 social-media videos from a text prompt."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # Standard library only for now.

[project.scripts]
prokv = "prokv.cli:main"

[tool.setuptools]
packages = ["prokv"]
