[project]
name = "cbroll"
version = "0.1.0"
description = "Collage B-Roll: automated editorial collage videos from a text script"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "numpy>=1.26",
  "pillow>=10.3",
  "opencv-python-headless>=4.9",
  "rembg>=2.0.57",
  "onnxruntime>=1.18",
  "cairosvg>=2.7",
  "requests>=2.31",
]

[project.scripts]
cbroll = "cbroll.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
