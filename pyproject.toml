[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prokv"
version = "0.2.0"
description = "Turn text into editorial motion-infographic Reels (vertical 1080x1920 MP4)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pillow>=10.1"]  # FFmpeg must also be installed (system binary).

[project.optional-dependencies]
tts = ["torch>=2.0"]   # Silero TTS (local Russian voiceover): pip install -e ".[tts]"

[project.scripts]
prokv = "prokv.cli:main"

[tool.setuptools.packages.find]
include = ["prokv*"]
